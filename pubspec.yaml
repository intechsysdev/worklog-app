name: worklog_mobile
description: "WorkLog · Bitácora de actividades (INTECHSYS ONE)"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  dio: ^5.11.1
  json_annotation: ^4.12.0
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  crypto: ^3.0.8
  uuid: ^4.6.0
  sqflite: ^2.4.5
  path: ^1.9.1
  connectivity_plus: ^7.3.2
  geolocator: ^14.0.1
  permission_handler: ^12.0.1
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  image_picker: ^1.2.4
  signature: ^6.4.0
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  flutter_localizations:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.15.2
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
